name: Build PVE Kernel

on:
  schedule:
    - cron: '22 03 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild selected flavours (published packages are never replaced)
        type: boolean
        default: false
      source_ref:
        description: Raspberry Pi source ref or commit (blank uses the tracked branch)
        type: string
        default: ''
      flavour:
        description: Kernel flavours to check for missing release assets
        type: choice
        options:
          - all
          - v8
          - '2712'
        default: all

permissions:
  actions: read
  contents: write

env:
  RPI_BRANCH: rpi-6.18.y

concurrency:
  group: rpi-kernel
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ steps.detect.outputs.build }}
      rpi_head: ${{ steps.detect.outputs.rpi_head }}
      matrix: ${{ steps.detect.outputs.matrix }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test release planning and immutable publication
        run: python3 -B -m unittest discover -s tools -p 'test_kernel_release.py' -v

      - name: Resolve Raspberry Pi kernel source release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_INPUT: ${{ inputs.force }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
          FLAVOUR_INPUT: ${{ inputs.flavour }}
        run: |
          set -euo pipefail
          source="${RUNNER_TEMP}/rpi-linux"
          source_ref="${SOURCE_REF_INPUT:-$RPI_BRANCH}"
          [[ "$source_ref" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]*$ ]] || { echo 'Invalid source ref' >&2; exit 1; }
          git init --quiet "$source"
          git -C "$source" remote add origin https://github.com/raspberrypi/linux.git
          git -C "$source" fetch --quiet --depth 1 origin "$source_ref"
          git -C "$source" checkout --quiet --detach FETCH_HEAD

          rpi_head="$(git -C "$source" rev-parse HEAD)"
          makefile="$source/Makefile"
          version="$(sed -n 's/^VERSION = //p' "$makefile")"
          patchlevel="$(sed -n 's/^PATCHLEVEL = //p' "$makefile")"
          sublevel="$(sed -n 's/^SUBLEVEL = //p' "$makefile")"
          extraversion="$(sed -n 's/^EXTRAVERSION = //p' "$makefile")"
          [ -n "$version" ] && [ -n "$patchlevel" ] && [ -n "$sublevel" ]
          release_tag="${version}.${patchlevel}.${sublevel}${extraversion}-rpi"

          printf 'rpi_head=%s\nrelease_tag=%s\n' "$rpi_head" "$release_tag" >> "$GITHUB_OUTPUT"
          RELEASE_TAG="$release_tag" python3 tools/kernel-release.py plan

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build native ARM64 Raspberry Pi package
        env:
          RPI_HEAD: ${{ needs.resolve.outputs.rpi_head }}
          RPI_FLAVOUR: ${{ matrix.flavour }}
          ZFS_VERSION: 2.4.4
          KBUILD_BUILD_VERSION: 1
        run: |
          docker run --rm \
            --platform linux/arm64 \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env WORK_DIR=/workspace/work \
            --env RPI_HEAD \
            --env RPI_FLAVOUR \
            --env ZFS_VERSION \
            --env KBUILD_BUILD_VERSION \
            debian:trixie \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq autoconf automake bc bison build-essential ca-certificates cpio dwarves flex gawk gettext git libaio-dev libattr1-dev libblkid-dev libelf-dev libncurses-dev libssl-dev libtirpc-dev libtool libudev-dev pkg-config python3 rsync uuid-dev xz-utils zlib1g-dev
              git config --global --add safe.directory /workspace
              bash tools/build-pve-kernel.sh
            '

      - name: Upload kernel package
        uses: actions/upload-artifact@v7
        with:
          name: rpi-kernel-${{ matrix.kernel_version }}
          path: .artifacts/packages/*.deb
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: [resolve, build]
    if: needs.resolve.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Download kernel package
        uses: actions/download-artifact@v8
        with:
          name: rpi-kernel-${{ matrix.kernel_version }}
          path: kernel

      - name: Validate Raspberry Pi kernel payload
        env:
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          RPI_FLAVOUR: ${{ matrix.flavour }}
        run: |
          set -euo pipefail
          case "$RPI_FLAVOUR" in
            v8) boot_dtb=bcm2711-rpi-4-b.dtb ;;
            2712) boot_dtb=bcm2712-rpi-5-b.dtb ;;
            *) exit 1 ;;
          esac
          shopt -s nullglob
          packages=(kernel/linux-image-"$KERNEL_VERSION".deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "FATAL: expected one ARM64 linux-image package" >&2
            exit 1
          fi
          contents="$(mktemp)"
          package_root="$(mktemp -d)"
          control_root="$(mktemp -d)"
          trap 'rm -rf "$contents" "$package_root" "$control_root"' EXIT
          dpkg-deb --contents "${packages[0]}" > "$contents"
          dpkg-deb --extract "${packages[0]}" "$package_root"
          dpkg-deb --control "${packages[0]}" "$control_root"
          test -s "$package_root/usr/lib/linux-image-$KERNEL_VERSION/broadcom/$boot_dtb"
          [[ $(dpkg-deb -f "${packages[0]}" Package) == "linux-image-$KERNEL_VERSION" ]]
          [[ $(dpkg-deb -f "${packages[0]}" Version) == "$KERNEL_VERSION" ]]
          [[ $(dpkg-deb -f "${packages[0]}" Architecture) == arm64 ]]
          grep -qE " \./lib/modules/$KERNEL_VERSION/updates/zfs/spl\.ko$" "$contents"
          grep -qE " \./lib/modules/$KERNEL_VERSION/updates/zfs/zfs\.ko$" "$contents"

          image="$package_root/boot/vmlinuz-$KERNEL_VERSION"
          config="$package_root/boot/config-$KERNEL_VERSION"
          spl_module="$package_root/lib/modules/$KERNEL_VERSION/updates/zfs/spl.ko"
          zfs_module="$package_root/lib/modules/$KERNEL_VERSION/updates/zfs/zfs.ko"
          postinst="$control_root/postinst"
          test -s "$image"
          test -s "$config"
          grep -qx 'Provides: zfs-modules' "$control_root/control"
          grep -Fq 'DEB_MAINT_PARAMS=configure run-parts' "$postinst"
          gzip -t "$image"
          gzip -cd "$image" > "$package_root/Image"
          strings "$package_root/Image" | grep -F "#1 SMP PREEMPT_DYNAMIC PMX ${KERNEL_VERSION%-rpi-*} (" >/dev/null
          [[ $(modinfo -F vermagic "$spl_module") == "$KERNEL_VERSION"* ]]
          [[ $(modinfo -F vermagic "$zfs_module") == "$KERNEL_VERSION"* ]]

          for option in \
            CONFIG_ARCH_BCM2835=y \
            CONFIG_BCM2835_MBOX=y \
            CONFIG_RASPBERRYPI_FIRMWARE=y \
            CONFIG_BCMGENET=y \
            CONFIG_USB_XHCI_HCD=y \
            CONFIG_USB_XHCI_PCI=y \
            CONFIG_USB_STORAGE=y \
            CONFIG_USB_UAS=y \
            CONFIG_SCSI=y \
            CONFIG_BLK_DEV_SD=y \
            CONFIG_BLK_DEV_INITRD=y \
            CONFIG_RD_ZSTD=y \
            CONFIG_KSM=y \
            CONFIG_PREEMPT_DYNAMIC=y \
            CONFIG_IPV6=y \
            CONFIG_KVM=y \
            CONFIG_SECCOMP=y \
            CONFIG_SECCOMP_FILTER=y \
            CONFIG_CGROUPS=y \
            CONFIG_MEMCG=y \
            CONFIG_CPUSETS=y \
            CONFIG_CGROUP_DMEM=y \
            CONFIG_NAMESPACES=y \
            CONFIG_USER_NS=y \
            CONFIG_PID_NS=y \
            CONFIG_NET_NS=y \
            CONFIG_VETH=m \
            CONFIG_VLAN_8021Q=m \
            CONFIG_OVERLAY_FS=m \
            CONFIG_SECURITY_APPARMOR=y \
            CONFIG_BPF_LSM=y \
            CONFIG_USERFAULTFD=y \
            CONFIG_FANOTIFY_ACCESS_PERMISSIONS=y \
            CONFIG_NETWORK_SECMARK=y \
            CONFIG_VIRTIO=y \
            CONFIG_VIRTIO_PCI=y \
            CONFIG_VIRTIO_MMIO=y \
            CONFIG_VFIO=m \
            CONFIG_VFIO_PCI=m \
            CONFIG_IOMMUFD=m \
            CONFIG_NETFILTER_XTABLES=m \
            CONFIG_IP_NF_IPTABLES=m \
            CONFIG_IP_NF_RAW=m \
            CONFIG_IP_NF_NAT=m \
            CONFIG_IP6_NF_IPTABLES=m \
            CONFIG_IP6_NF_RAW=m \
            CONFIG_IP6_NF_NAT=m \
            CONFIG_BRIDGE_EBT_T_FILTER=m \
            CONFIG_BRIDGE_EBT_BROUTE=m \
            CONFIG_BRIDGE_EBT_T_NAT=m \
            CONFIG_NFT_COMPAT=m \
            CONFIG_GENEVE=m \
            CONFIG_OPENVSWITCH_GENEVE=m \
            CONFIG_NET_ACT_VLAN=m \
            CONFIG_NET_ACT_BPF=m \
            CONFIG_NET_ACT_TUNNEL_KEY=m \
            CONFIG_NET_ACT_CT=m \
            CONFIG_DM_UEVENT=y \
            CONFIG_SQUASHFS_LZ4=y \
            CONFIG_CEPH_LIB_USE_DNS_RESOLVER=y \
            CONFIG_LOCALVERSION=\"-$RPI_FLAVOUR\"; do
            grep -qx "$option" "$config"
          done
          if [ "$RPI_FLAVOUR" = 2712 ]; then
            for option in CONFIG_ARM64_16K_PAGES=y CONFIG_MFD_RP1=y CONFIG_PINCTRL_RP1=y CONFIG_MACB=y CONFIG_BLK_DEV_NVME=y; do
              grep -qx "$option" "$config"
            done
          else
            grep -qx CONFIG_ARM64_4K_PAGES=y "$config"
          fi

  publish:
    needs: [resolve, build, validate]
    if: needs.resolve.outputs.build == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pve-rpi-release-${{ needs.resolve.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download kernel package
        uses: actions/download-artifact@v8
        with:
          pattern: rpi-kernel-*
          merge-multiple: true
          path: kernel

      - name: Publish validated kernel package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          BUILD_MATRIX: ${{ needs.resolve.outputs.matrix }}
        run: |
          set -euo pipefail
          python3 tools/kernel-release.py publish

  apt:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-kernel-apt.yml
    secrets: inherit
