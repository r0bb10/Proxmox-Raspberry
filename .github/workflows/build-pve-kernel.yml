name: Build PVE Kernel

on:
  schedule:
    - cron: '22 03 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and replace existing release assets
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: rpi-pi4-kernel
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ steps.detect.outputs.build }}
      force: ${{ steps.detect.outputs.force }}
      rpi_head: ${{ steps.detect.outputs.rpi_head }}
      kernel_version: ${{ steps.detect.outputs.kernel_version }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
    steps:
      - name: Resolve Raspberry Pi kernel source release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          set -euo pipefail
          source="${RUNNER_TEMP}/rpi-linux"
          git init --quiet "$source"
          git -C "$source" remote add origin https://github.com/raspberrypi/linux.git
          git -C "$source" fetch --quiet --depth 1 origin rpi-6.18.y
          git -C "$source" checkout --quiet --detach FETCH_HEAD

          rpi_head="$(git -C "$source" rev-parse HEAD)"
          makefile="$source/Makefile"
          version="$(sed -n 's/^VERSION = //p' "$makefile")"
          patchlevel="$(sed -n 's/^PATCHLEVEL = //p' "$makefile")"
          sublevel="$(sed -n 's/^SUBLEVEL = //p' "$makefile")"
          extraversion="$(sed -n 's/^EXTRAVERSION = //p' "$makefile")"
          [ -n "$version" ] && [ -n "$patchlevel" ] && [ -n "$sublevel" ]
          kernel_version="${version}.${patchlevel}.${sublevel}${extraversion}-rpi-v8"
          release_tag="$kernel_version"

          printf 'rpi_head=%s\nkernel_version=%s\nrelease_tag=%s\n' "$rpi_head" "$kernel_version" "$release_tag" >> "$GITHUB_OUTPUT"
          force=0
          [ "$FORCE_INPUT" != true ] || force=1
          printf 'force=%s\n' "$force" >> "$GITHUB_OUTPUT"

          if [ "$force" = 0 ] && gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice:: ${release_tag} is already published; nothing to do."
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build native ARM64 Raspberry Pi package
        env:
          RPI_HEAD: ${{ needs.resolve.outputs.rpi_head }}
          RPI_FLAVOUR: v8
          ZFS_VERSION: 2.4.4
          KBUILD_BUILD_VERSION: 1
        run: |
          docker run --rm \
            --platform linux/arm64 \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env WORK_DIR=/workspace/work \
            --env RPI_HEAD \
            --env RPI_FLAVOUR \
            --env ZFS_VERSION \
            --env KBUILD_BUILD_VERSION \
            debian:trixie \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq autoconf automake bc bison build-essential ca-certificates cpio dwarves flex gawk gettext git libaio-dev libattr1-dev libblkid-dev libelf-dev libncurses-dev libssl-dev libtirpc-dev libtool libudev-dev pkg-config python3 rsync uuid-dev xz-utils zlib1g-dev
              git config --global --add safe.directory /workspace
              bash tools/build-pve-kernel.sh
            '

      - name: Upload kernel package
        uses: actions/upload-artifact@v7
        with:
          name: rpi-kernel-${{ needs.resolve.outputs.kernel_version }}
          path: |
            .artifacts/packages/*.deb
            .artifacts/packages/*.sha256
            .artifacts/packages/build-manifest.txt
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: [resolve, build]
    if: needs.resolve.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Download kernel package
        uses: actions/download-artifact@v8
        with:
          name: rpi-kernel-${{ needs.resolve.outputs.kernel_version }}
          path: kernel

      - name: Validate Raspberry Pi kernel payload
        env:
          KERNEL_VERSION: ${{ needs.resolve.outputs.kernel_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(kernel/linux-image-"$KERNEL_VERSION"_arm64.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "FATAL: expected one ARM64 linux-image package" >&2
            exit 1
          fi
          contents="$(mktemp)"
          package_root="$(mktemp -d)"
          control_root="$(mktemp -d)"
          trap 'rm -rf "$contents" "$package_root" "$control_root"' EXIT
          dpkg-deb --contents "${packages[0]}" > "$contents"
          dpkg-deb --extract "${packages[0]}" "$package_root"
          dpkg-deb --control "${packages[0]}" "$control_root"
          grep -qE " \./usr/lib/linux-image-$KERNEL_VERSION/broadcom/bcm2711-rpi-4-b\.dtb$" "$contents"
          grep -qE " \./lib/modules/$KERNEL_VERSION/updates/zfs/spl\.ko$" "$contents"
          grep -qE " \./lib/modules/$KERNEL_VERSION/updates/zfs/zfs\.ko$" "$contents"

          image="$package_root/boot/vmlinuz-$KERNEL_VERSION"
          config="$package_root/boot/config-$KERNEL_VERSION"
          spl_module="$package_root/lib/modules/$KERNEL_VERSION/updates/zfs/spl.ko"
          zfs_module="$package_root/lib/modules/$KERNEL_VERSION/updates/zfs/zfs.ko"
          postinst="$control_root/postinst"
          test -s "$image"
          test -s "$config"
          grep -qx 'Provides: zfs-modules' "$control_root/control"
          grep -Fq 'DEB_MAINT_PARAMS=configure run-parts' "$postinst"
          gzip -t "$image"
          gzip -cd "$image" | strings | grep -Fq "#1 SMP PREEMPT_DYNAMIC PMX ${KERNEL_VERSION%-rpi-*} ("
          [[ $(modinfo -F vermagic "$spl_module") == "$KERNEL_VERSION"* ]]
          [[ $(modinfo -F vermagic "$zfs_module") == "$KERNEL_VERSION"* ]]

          for option in \
            CONFIG_ARCH_BCM2835=y \
            CONFIG_BCM2835_MBOX=y \
            CONFIG_RASPBERRYPI_FIRMWARE=y \
            CONFIG_BCMGENET=y \
            CONFIG_USB_XHCI_HCD=y \
            CONFIG_USB_XHCI_PCI=y \
            CONFIG_USB_STORAGE=y \
            CONFIG_USB_UAS=y \
            CONFIG_SCSI=y \
            CONFIG_BLK_DEV_SD=y \
            CONFIG_BLK_DEV_INITRD=y \
            CONFIG_RD_ZSTD=y \
            CONFIG_KSM=y \
            CONFIG_PREEMPT_DYNAMIC=y \
            CONFIG_IPV6=y \
            CONFIG_KVM=y \
            CONFIG_SECCOMP=y \
            CONFIG_SECCOMP_FILTER=y \
            CONFIG_CGROUPS=y \
            CONFIG_MEMCG=y \
            CONFIG_CPUSETS=y \
            CONFIG_NAMESPACES=y \
            CONFIG_USER_NS=y \
            CONFIG_PID_NS=y \
            CONFIG_NET_NS=y \
            CONFIG_VETH=m \
            CONFIG_VLAN_8021Q=m \
            CONFIG_OVERLAY_FS=m \
            CONFIG_SECURITY_APPARMOR=y \
            CONFIG_NETWORK_SECMARK=y \
            CONFIG_VIRTIO=y \
            CONFIG_VIRTIO_PCI=y \
            CONFIG_VIRTIO_MMIO=y \
            CONFIG_NETFILTER_XTABLES=m \
            CONFIG_IP_NF_IPTABLES=m \
            CONFIG_IP_NF_RAW=m \
            CONFIG_IP6_NF_IPTABLES=m \
            CONFIG_IP6_NF_RAW=m \
            CONFIG_BRIDGE_EBT_T_FILTER=m \
            CONFIG_NFT_COMPAT=m \
            CONFIG_LOCALVERSION=\"-rpi-v8\"; do
            grep -qx "$option" "$config"
          done

  publish:
    needs: [resolve, build, validate]
    if: needs.resolve.outputs.build == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pve-rpi-release-${{ needs.resolve.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Download kernel package
        uses: actions/download-artifact@v8
        with:
          name: rpi-kernel-${{ needs.resolve.outputs.kernel_version }}
          path: kernel

      - name: Publish validated kernel package
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_VERSION: ${{ needs.resolve.outputs.kernel_version }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RPI_HEAD: ${{ needs.resolve.outputs.rpi_head }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(kernel/linux-image-"$KERNEL_VERSION"_arm64.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "FATAL: expected one ARM64 kernel package" >&2
            exit 1
          fi

          notes="${RUNNER_TEMP}/kernel-release-notes.md"
          cat > "$notes" <<EOF
          Custom ARM64 Proxmox VE kernel for Raspberry Pi.

          Platform: Raspberry Pi 4
          Raspberry Pi Linux source: $RPI_HEAD
          Install with: \`apt install ./linux-image-$KERNEL_VERSION_arm64.deb\`
          EOF

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" kernel/* --repo "$GITHUB_REPOSITORY" --clobber
