name: Build PVE Kernel

on:
  schedule:
    - cron: '22 03 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: Target Raspberry Pi platform(s)
        required: true
        default: both
        type: choice
        options:
          - both
          - pi4
          - pi5
      force:
        description: Rebuild and replace existing release assets
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: pve-rpi-kernel-${{ inputs.platform || 'both' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ steps.detect.outputs.build }}
      force: ${{ steps.detect.outputs.force }}
      pve_head: ${{ steps.detect.outputs.pve_head }}
      pve_version: ${{ steps.detect.outputs.pve_version }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
    steps:
      - name: Resolve PVE kernel source release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          set -euo pipefail
          source="${RUNNER_TEMP}/pve-kernel"
          git clone --quiet --depth 1 --no-tags https://git.proxmox.com/git/pve-kernel.git "$source"

          pve_head="$(git -C "$source" rev-parse HEAD)"
          makefile="$(git -C "$source" show "$pve_head:Makefile")"
          kernel_maj="$(printf '%s\n' "$makefile" | sed -n 's/^KERNEL_MAJ=//p')"
          kernel_min="$(printf '%s\n' "$makefile" | sed -n 's/^KERNEL_MIN=//p')"
          kernel_patchlevel="$(printf '%s\n' "$makefile" | sed -n 's/^KERNEL_PATCHLEVEL=//p')"
          krel="$(printf '%s\n' "$makefile" | sed -n 's/^KREL=//p')"
          krel_extra="$(printf '%s\n' "$makefile" | sed -n 's/^KREL_EXTRA=//p')"
          [ -n "$kernel_maj" ] && [ -n "$kernel_min" ] && [ -n "$kernel_patchlevel" ] && [ -n "$krel" ]
          pve_version="${kernel_maj}.${kernel_min}.${kernel_patchlevel}-${krel}${krel_extra}-pve"
          release_tag="$pve_version"

          printf 'pve_head=%s\npve_version=%s\nrelease_tag=%s\n' "$pve_head" "$pve_version" "$release_tag" >> "$GITHUB_OUTPUT"
          force=0
          [ "$FORCE_INPUT" != true ] || force=1
          printf 'force=%s\n' "$force" >> "$GITHUB_OUTPUT"

          if [ "$force" = 0 ] && gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice:: ${release_tag} is already published; nothing to do."
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  preflight:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'schedule' || inputs.platform == 'both') && '["pi4", "pi5"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Raspberry Pi packaging patches
        env:
          PVE_HEAD: ${{ needs.resolve.outputs.pve_head }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          source="${RUNNER_TEMP}/pve-kernel"
          git clone --quiet --depth 1 --no-tags https://git.proxmox.com/git/pve-kernel.git "$source"
          if [ "$(git -C "$source" rev-parse HEAD)" != "$PVE_HEAD" ]; then
            git -C "$source" fetch --quiet --depth 1 origin "$PVE_HEAD"
            git -C "$source" checkout --quiet FETCH_HEAD
          fi

          case "$PLATFORM" in
            pi4) boot_kernel=kernel8.img; boot_initramfs=initramfs8; boot_dtb=bcm2711-rpi-4-b.dtb ;;
            pi5) boot_kernel=kernel_2712.img; boot_initramfs=initramfs_2712; boot_dtb=bcm2712-rpi-5-b.dtb ;;
            *) echo "FATAL: unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          patch="${RUNNER_TEMP}/boot.patch"
          sed \
            -e "s|@BOOT_KERNEL@|$boot_kernel|g" \
            -e "s|@BOOT_INITRAMFS@|$boot_initramfs|g" \
            -e "s|@BOOT_DTB@|$boot_dtb|g" \
            patches/boot.patch > "$patch"
          git -C "$source" apply --unidiff-zero --check "$patch"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'schedule' || inputs.platform == 'both') && '["pi4", "pi5"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build native ARM64 PVE packages
        env:
          PVE_HEAD: ${{ needs.resolve.outputs.pve_head }}
          PVE_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm \
            --platform linux/arm64 \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env WORK_DIR=/workspace/work \
            --env PVE_HEAD \
            --env PVE_PLATFORM \
            debian:trixie \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq build-essential bison ca-certificates devscripts dh-python equivs flex git patch python3 sphinx-common
              git config --global --add safe.directory /workspace
              bash tools/build-pve-kernel.sh
            '

      - name: Upload kernel package
        uses: actions/upload-artifact@v7
        with:
          name: pve-kernel-${{ needs.resolve.outputs.pve_version }}-${{ matrix.platform }}
          path: work/pve-kernel/proxmox-kernel-${{ needs.resolve.outputs.pve_version }}_*_arm64.deb
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: [resolve, build]
    if: needs.resolve.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'schedule' || inputs.platform == 'both') && '["pi4", "pi5"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - name: Download kernel package
        uses: actions/download-artifact@v8
        with:
          name: pve-kernel-${{ needs.resolve.outputs.pve_version }}-${{ matrix.platform }}
          path: kernel

      - name: Validate Raspberry Pi kernel payload
        env:
          PVE_VERSION: ${{ needs.resolve.outputs.pve_version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(kernel/proxmox-kernel-"$PVE_VERSION"_*_arm64.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "FATAL: expected one ARM64 proxmox-kernel package" >&2
            exit 1
          fi
          contents="$(mktemp)"
          package_root="$(mktemp -d)"
          control_root="$(mktemp -d)"
          trap 'rm -rf "$contents" "$package_root" "$control_root"' EXIT
          dpkg-deb --contents "${packages[0]}" > "$contents"
          dpkg-deb --extract "${packages[0]}" "$package_root"
          dpkg-deb --control "${packages[0]}" "$control_root"
          if grep -qE ' \./boot/(vmlinuz|System\.map)-' "$contents"; then
            echo "FATAL: package must not own a bootable kernel or System.map under /boot" >&2
            exit 1
          fi
          case "$PLATFORM" in
            pi4)
              dtb=bcm2711-rpi-4-b.dtb; boot_initramfs=initramfs8
              platform_options=(CONFIG_PCIE_BRCMSTB=y)
              ;;
            pi5)
              dtb=bcm2712-rpi-5-b.dtb; boot_initramfs=initramfs_2712
              platform_options=(CONFIG_PCIE_BRCMSTB=y CONFIG_PINCTRL_RP1=y)
              ;;
            *) echo "FATAL: unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          grep -qE " \./usr/lib/proxmox-kernel/.*/Image\.gz$" "$contents"
          grep -qE " \./usr/lib/proxmox-kernel/.*/$dtb$" "$contents"
          grep -qE ' \./usr/lib/modules/.*/zfs/zfs\.ko' "$contents"

          image="$(find "$package_root/usr/lib/proxmox-kernel" -name Image.gz -type f -print -quit)"
          config="$package_root/boot/config-$PVE_VERSION"
          hook="$package_root/etc/initramfs/post-update.d/z50-proxmox-kernel-${PVE_VERSION//./_}"
          postinst="$control_root/postinst"
          test -n "$image"
          test -s "$config"
          test -x "$hook"
          bash -n "$hook"
          grep -qx "version=$PVE_VERSION" "$hook"
          grep -qx 'if ! mountpoint -q "$firmware_dir"; then' "$hook"
          grep -qx "install -m 0644 \"\$initrd\" \"\$firmware_dir/$boot_initramfs\"" "$hook"
          ! grep -Fq 'Failed to deploy Raspberry Pi initramfs' "$postinst"
          gzip -t "$image"
          arm_magic="$(gzip -cd "$image" | { dd bs=1 skip=56 count=4 status=none; cat >/dev/null; })"
          test "$arm_magic" = 'ARMd'

          for option in \
            CONFIG_ARCH_BCM2835=y \
            CONFIG_BCM2835_MBOX=y \
            CONFIG_RASPBERRYPI_FIRMWARE=y \
            CONFIG_BCMGENET=y \
            CONFIG_USB_XHCI_HCD=y \
            CONFIG_USB_XHCI_PCI=y \
            CONFIG_USB_STORAGE=y \
            CONFIG_USB_UAS=y \
            CONFIG_SCSI=y \
            CONFIG_BLK_DEV_SD=y \
            CONFIG_BLK_DEV_INITRD=y \
            CONFIG_RD_ZSTD=y \
            CONFIG_KSM=y \
            CONFIG_IPV6=y \
            CONFIG_KVM=y \
            CONFIG_SECCOMP=y \
            CONFIG_SECCOMP_FILTER=y \
            CONFIG_CGROUPS=y \
            CONFIG_MEMCG=y \
            CONFIG_CPUSETS=y \
            CONFIG_NAMESPACES=y \
            CONFIG_USER_NS=y \
            CONFIG_PID_NS=y \
            CONFIG_NET_NS=y \
            CONFIG_VETH=m \
            CONFIG_VLAN_8021Q=m \
            CONFIG_OVERLAY_FS=m \
            CONFIG_SECURITY_APPARMOR=y \
            CONFIG_NETWORK_SECMARK=y \
            CONFIG_VIRTIO=y \
            CONFIG_VIRTIO_PCI=y \
            CONFIG_VIRTIO_MMIO=y \
            CONFIG_NETFILTER_XTABLES=m \
            CONFIG_IP_NF_IPTABLES=m \
            CONFIG_IP6_NF_IPTABLES=m \
            CONFIG_NFT_COMPAT=m \
            "${platform_options[@]}"; do
            grep -qx "$option" "$config"
          done

      - name: Mark kernel package validated
        run: touch validated

      - name: Upload validation marker
        uses: actions/upload-artifact@v7
        with:
          name: pve-kernel-validated-${{ needs.resolve.outputs.pve_version }}-${{ matrix.platform }}
          path: validated
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, build, validate]
    if: always() && needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pve-rpi-release-${{ needs.resolve.outputs.release_tag }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'schedule' || inputs.platform == 'both') && '["pi4", "pi5"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - name: Check platform validation
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name' | grep -qx 'pve-kernel-validated-${{ needs.resolve.outputs.pve_version }}-${{ matrix.platform }}'; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download kernel package
        if: steps.validation.outputs.valid == 'true'
        uses: actions/download-artifact@v8
        with:
          name: pve-kernel-${{ needs.resolve.outputs.pve_version }}-${{ matrix.platform }}
          path: kernel

      - name: Publish validated kernel package
        if: steps.validation.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PVE_VERSION: ${{ needs.resolve.outputs.pve_version }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(kernel/proxmox-kernel-"$PVE_VERSION"_*_arm64.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "FATAL: expected one ARM64 kernel package for $PLATFORM" >&2
            exit 1
          fi

          asset="proxmox-kernel-${PVE_VERSION}-${PLATFORM}_arm64.deb"
          cp "${packages[0]}" "$asset"
          notes="${RUNNER_TEMP}/kernel-release-notes.md"
          cat > "$notes" <<EOF
          Custom ARM64 Proxmox VE kernel for Raspberry Pi.

          Platform: Raspberry Pi 4 & 5
          Based on official PVE Kernel sources
          Install with: \`apt install ./proxmox-kernel-*_arm64.deb\`
          EOF

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
