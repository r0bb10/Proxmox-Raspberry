name: Build PVE Image

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target Raspberry Pi platform
        required: true
        default: pi4
        type: choice
        options:
          - pi4
          - pi5
      rootfs:
        description: Root filesystem
        required: true
        default: ext4
        type: choice
        options:
          - ext4
          - zfs
      root_password:
        description: Root account password
        required: true
        default: root
        type: string
      hostname:
        description: Proxmox hostname
        required: true
        default: pve
        type: string
      domain:
        description: DNS domain
        required: true
        default: localdomain
        type: string
      ipv4_cidr:
        description: Static vmbr0 IPv4 address and prefix length
        required: true
        default: 192.168.1.2/24
        type: string
      gateway:
        description: Static vmbr0 IPv4 gateway
        required: true
        default: 192.168.1.1
        type: string
      dns_server:
        description: DNS server for the installed image
        required: true
        default: 192.168.1.1
        type: string

concurrency:
  group: pve-${{ inputs.platform }}-${{ inputs.rootfs }}-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      PVE_ROOT_PASSWORD: ${{ inputs.root_password }}
      PVE_PLATFORM: ${{ inputs.platform }}
      PVE_ROOTFS: ${{ inputs.rootfs }}
      PVE_HOSTNAME: ${{ inputs.hostname }}
      PVE_DOMAIN: ${{ inputs.domain }}
      PVE_IPV4_CIDR: ${{ inputs.ipv4_cidr }}
      PVE_GATEWAY: ${{ inputs.gateway }}
      PVE_DNS_SERVER: ${{ inputs.dns_server }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap dosfstools e2fsprogs parted rsync gnupg zfsutils-linux
          sudo modprobe zfs

      - name: Download latest custom kernel for target platform
        id: kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$PVE_PLATFORM" in
            pi4) asset_pattern='^linux-image-.*-rpi-v8\.deb$' ;;
            pi5) asset_pattern='^linux-image-.*-rpi-2712\.deb$' ;;
            *) echo "FATAL: unsupported platform: $PVE_PLATFORM" >&2; exit 1 ;;
          esac

          match="$({
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -r --arg pattern "$asset_pattern" '
                first(
                  .[][] |
                  select((.draft | not) and (.prerelease | not)) as $release |
                  $release.assets[] |
                  select(.name | test($pattern)) |
                  [$release.tag_name, .name, .browser_download_url, (.digest // "")] |
                  @tsv
                ) // empty
              '
          })"
          if [ -z "$match" ]; then
            echo "FATAL: no published custom kernel is available for $PVE_PLATFORM" >&2
            exit 1
          fi

          IFS=$'\t' read -r release_tag asset_name asset_url asset_digest <<<"$match"
          if [[ ! $asset_digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "FATAL: release asset $asset_name has no valid SHA-256 digest" >&2
            exit 1
          fi

          mkdir -p kernel
          curl --fail --location --silent --show-error --output "kernel/$asset_name" "$asset_url"
          printf '%s  %s\n' "${asset_digest#sha256:}" "kernel/$asset_name" | sha256sum --check --status

          printf 'path=%s\n' "$GITHUB_WORKSPACE/kernel/$asset_name" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'asset_name=%s\n' "$asset_name" >> "$GITHUB_OUTPUT"

      - name: Build Raspberry Pi image
        run: |
          sudo --preserve-env=PVE_ROOT_PASSWORD,PVE_PLATFORM,PVE_ROOTFS,PVE_HOSTNAME,PVE_DOMAIN,PVE_IPV4_CIDR,PVE_GATEWAY,PVE_DNS_SERVER bash tools/build-pve-image.sh \
            --platform "$PVE_PLATFORM" \
            --rootfs "$PVE_ROOTFS" \
            --kernel-deb "${{ steps.kernel.outputs.path }}" \
            --output "dist/proxmox-ve-$PVE_PLATFORM-$PVE_ROOTFS.img" \
            --reset

      - name: Record installed PVE version
        id: pve
        run: |
          set -euo pipefail
          version="$(
            sudo chroot "$GITHUB_WORKSPACE/.dev/$PVE_PLATFORM-$PVE_ROOTFS-image-build/rootfs" \
              dpkg-query -W -f='${Version}' pve-manager
          )"
          [ -n "$version" ]
          image_name="proxmox-ve-$PVE_PLATFORM-$PVE_ROOTFS-$version"
          printf 'image_name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_NAME=%s\n' "$image_name" >> "$GITHUB_ENV"
          sudo mv "dist/proxmox-ve-$PVE_PLATFORM-$PVE_ROOTFS.img" "dist/$image_name.img"

      - name: Validate completed image
        run: |
          sudo --preserve-env=PVE_PLATFORM,PVE_ROOTFS,PVE_HOSTNAME,PVE_DOMAIN,PVE_IPV4_CIDR,PVE_GATEWAY,PVE_DNS_SERVER \
            bash tools/validate-pve-image.sh --image "dist/$IMAGE_NAME.img"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pve.outputs.image_name }}
          path: dist/${{ steps.pve.outputs.image_name }}.img
          retention-days: 14
          compression-level: 6
