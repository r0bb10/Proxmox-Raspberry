name: Build PVE Image

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target Raspberry Pi platform
        required: true
        default: pi4
        type: choice
        options:
          - pi4
          - pi5
      rootfs:
        description: Root filesystem
        required: true
        default: ext4
        type: choice
        options:
          - ext4
          - zfs
      root_password:
        description: Root account password
        required: true
        default: root
        type: string
      hostname:
        description: Proxmox hostname
        required: true
        default: pve
        type: string
      domain:
        description: DNS domain
        required: true
        default: localdomain
        type: string
      ipv4_cidr:
        description: Static vmbr0 IPv4 address and prefix length
        required: true
        default: 192.168.1.2/24
        type: string
      gateway:
        description: Static vmbr0 IPv4 gateway
        required: true
        default: 192.168.1.1
        type: string
      dns_server:
        description: DNS server for the installed image
        required: true
        default: 192.168.1.1
        type: string

concurrency:
  group: pve-${{ inputs.platform }}-${{ inputs.rootfs }}-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      PVE_ROOT_PASSWORD: ${{ inputs.root_password }}
      PVE_PLATFORM: ${{ inputs.platform }}
      PVE_ROOTFS: ${{ inputs.rootfs }}
      PVE_HOSTNAME: ${{ inputs.hostname }}
      PVE_DOMAIN: ${{ inputs.domain }}
      PVE_IPV4_CIDR: ${{ inputs.ipv4_cidr }}
      PVE_GATEWAY: ${{ inputs.gateway }}
      PVE_DNS_SERVER: ${{ inputs.dns_server }}
    outputs:
      pve_version: ${{ steps.pve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap dosfstools e2fsprogs parted rsync gnupg zfsutils-linux
          sudo modprobe zfs

      - name: Build Raspberry Pi image
        run: |
          sudo --preserve-env=PVE_ROOT_PASSWORD,PVE_PLATFORM,PVE_ROOTFS,PVE_HOSTNAME,PVE_DOMAIN,PVE_IPV4_CIDR,PVE_GATEWAY,PVE_DNS_SERVER bash tools/build-pve-image.sh \
            --platform "$PVE_PLATFORM" \
            --rootfs "$PVE_ROOTFS" \
            --output "dist/proxmox-ve-$PVE_PLATFORM-$PVE_ROOTFS.img" \
            --reset

      - name: Record installed PVE version
        id: pve
        run: |
          set -euo pipefail
          version="$(
            sudo chroot "$GITHUB_WORKSPACE/.dev/$PVE_PLATFORM-image-build/rootfs" \
              dpkg-query -W -f='${Version}' pve-manager
          )"
          [ -n "$version" ]
          image_name="proxmox-ve-$PVE_PLATFORM-$PVE_ROOTFS-$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'image_name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_NAME=%s\n' "$image_name" >> "$GITHUB_ENV"
          sudo mv "dist/proxmox-ve-$PVE_PLATFORM-$PVE_ROOTFS.img" "dist/$image_name.img"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pve.outputs.image_name }}
          path: dist/${{ steps.pve.outputs.image_name }}.img
          retention-days: 14
          compression-level: 6

  validate:
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      PVE_HOSTNAME: ${{ inputs.hostname }}
      PVE_PLATFORM: ${{ inputs.platform }}
      PVE_ROOTFS: ${{ inputs.rootfs }}
      PVE_DOMAIN: ${{ inputs.domain }}
      PVE_IPV4_CIDR: ${{ inputs.ipv4_cidr }}
      PVE_GATEWAY: ${{ inputs.gateway }}
      PVE_DNS_SERVER: ${{ inputs.dns_server }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: proxmox-ve-${{ inputs.platform }}-${{ inputs.rootfs }}-${{ needs.build.outputs.pve_version }}
          path: image

      - name: Validate Raspberry Pi boot payload and root filesystem
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq parted zfsutils-linux
          sudo modprobe zfs
          case "$PVE_PLATFORM" in
            pi4)
              boot_kernel=kernel8.img
              boot_initramfs=initramfs8
              boot_dtb=bcm2711-rpi-4-b.dtb
              ;;
            pi5)
              boot_kernel=kernel_2712.img
              boot_initramfs=initramfs_2712
              boot_dtb=bcm2712-rpi-5-b.dtb
              ;;
            *) echo "FATAL: unsupported platform: $PVE_PLATFORM" >&2; exit 1 ;;
          esac
          image="image/proxmox-ve-$PVE_PLATFORM-$PVE_ROOTFS-${{ needs.build.outputs.pve_version }}.img"
          boot="$(mktemp -d)"
          root="$(mktemp -d)"
          loop=""
          cleanup() {
            sudo umount "$boot" "$root" 2>/dev/null || true
            [ "$PVE_ROOTFS" != zfs ] || sudo zpool export rpool 2>/dev/null || true
            [ -z "$loop" ] || sudo losetup -d "$loop" 2>/dev/null || true
            rm -rf "$boot" "$root"
          }
          trap cleanup EXIT
          (( $(stat --format=%s "$image") % 512 == 0 ))
          loop="$(sudo losetup -Pf --show "$image")"
          for _ in {1..10}; do
            [ -b "${loop}p1" ] && [ -b "${loop}p2" ] && break
            sudo partprobe "$loop"
            sleep 1
          done
          [ -b "${loop}p1" ] && [ -b "${loop}p2" ]
          sudo mount "${loop}p1" "$boot"
          test "$(sudo blkid -s TYPE -o value "${loop}p1")" = vfat
          test "$(sudo blkid -s LABEL -o value "${loop}p1")" = BOOT
          if [ "$PVE_ROOTFS" = ext4 ]; then
            sudo mount "${loop}p2" "$root"
            test "$(sudo blkid -s TYPE -o value "${loop}p2")" = ext4
            test "$(sudo blkid -s LABEL -o value "${loop}p2")" = rootfs
            root_uuid="$(sudo blkid -s UUID -o value "${loop}p2")"
          else
            sudo zpool import -N -f -R "$root" -d /dev rpool
            sudo zfs mount rpool/ROOT/pve-1
            sudo zpool status rpool
            sudo zfs list rpool/ROOT/pve-1
          fi
          test -s "$boot/start4.elf"
          test -s "$boot/fixup4.dat"
          test -s "$boot/$boot_kernel"
          test -s "$boot/$boot_initramfs"
          test -s "$boot/$boot_dtb"
          test -d "$boot/overlays"
          grep -qFx 'arm_64bit=1' "$boot/config.txt"
          grep -qFx 'enable_uart=1' "$boot/config.txt"
          grep -qFx 'auto_initramfs=1' "$boot/config.txt"
          grep -qFx "kernel=$boot_kernel" "$boot/config.txt"
          test "$(wc -l < "$boot/cmdline.txt")" -eq 1
          if [ "$PVE_ROOTFS" = ext4 ]; then
            grep -qF "root=UUID=$root_uuid " "$boot/cmdline.txt"
            grep -qFx "UUID=$root_uuid / ext4 defaults,noatime 0 1" "$root/etc/fstab"
          else
            grep -qF 'root=ZFS=rpool/ROOT/pve-1' "$boot/cmdline.txt"
            grep -qFx '# Root filesystem is rpool/ROOT/pve-1.' "$root/etc/fstab"
            test -s "$root/etc/hostid"
            test -s "$root/etc/zfs/zpool.cache"
          fi
          grep -qF 'console=serial0,115200' "$boot/cmdline.txt"
          grep -qFx 'LABEL=BOOT /boot/firmware vfat defaults 0 2' "$root/etc/fstab"
          fqdn="$PVE_HOSTNAME.$PVE_DOMAIN"
          sudo grep -qFx "$PVE_HOSTNAME" "$root/etc/hostname"
          grep -qFx "${PVE_IPV4_CIDR%/*} $fqdn $PVE_HOSTNAME" "$root/etc/hosts"
          grep -qFx 'iface vmbr0 inet static' "$root/etc/network/interfaces"
          grep -qFx "    address $PVE_IPV4_CIDR" "$root/etc/network/interfaces"
          grep -qFx "    gateway $PVE_GATEWAY" "$root/etc/network/interfaces"
          grep -qFx "    dns-nameservers $PVE_DNS_SERVER" "$root/etc/network/interfaces"
          test -s "$root/etc/modprobe.d/zfs.conf"
          sudo chroot "$root" dpkg-query -W pve-edk2-firmware pve-edk2-firmware-aarch64 pve-firmware
