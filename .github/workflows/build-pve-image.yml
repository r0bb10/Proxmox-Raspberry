name: Build PVE Image

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target Raspberry Pi platform
        required: true
        default: pi4
        type: choice
        options:
          - pi4
          - pi5
      rootfs:
        description: Root filesystem
        required: true
        default: ext4
        type: choice
        options:
          - ext4
          - zfs
      root_password:
        description: Root account password
        required: true
        default: root
        type: string
      hostname:
        description: Proxmox hostname
        required: true
        default: pve
        type: string
      domain:
        description: DNS domain
        required: true
        default: localdomain
        type: string
      ipv4_cidr:
        description: Static vmbr0 IPv4 address and prefix length
        required: true
        default: 192.168.1.2/24
        type: string
      gateway:
        description: Static vmbr0 IPv4 gateway
        required: true
        default: 192.168.1.1
        type: string
      dns_server:
        description: DNS server for the installed image
        required: true
        default: 192.168.1.1
        type: string

concurrency:
  group: pve-${{ inputs.platform }}-${{ inputs.rootfs }}-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      PVE_ROOT_PASSWORD: ${{ inputs.root_password }}
      PVE_PLATFORM: ${{ inputs.platform }}
      PVE_ROOTFS: ${{ inputs.rootfs }}
      PVE_HOSTNAME: ${{ inputs.hostname }}
      PVE_DOMAIN: ${{ inputs.domain }}
      PVE_IPV4_CIDR: ${{ inputs.ipv4_cidr }}
      PVE_GATEWAY: ${{ inputs.gateway }}
      PVE_DNS_SERVER: ${{ inputs.dns_server }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap dosfstools e2fsprogs parted rsync gnupg zfsutils-linux
          sudo modprobe zfs

      - name: Build Raspberry Pi image
        run: |
          sudo --preserve-env=PVE_ROOT_PASSWORD,PVE_PLATFORM,PVE_ROOTFS,PVE_HOSTNAME,PVE_DOMAIN,PVE_IPV4_CIDR,PVE_GATEWAY,PVE_DNS_SERVER bash tools/build-pve-image.sh \
            --platform "$PVE_PLATFORM" \
            --rootfs "$PVE_ROOTFS" \
            --output "dist/proxmox-ve-$PVE_PLATFORM-$PVE_ROOTFS.img" \
            --reset

      - name: Record installed PVE version
        id: pve
        run: |
          set -euo pipefail
          version="$(
            sudo chroot "$GITHUB_WORKSPACE/.dev/$PVE_PLATFORM-$PVE_ROOTFS-image-build/rootfs" \
              dpkg-query -W -f='${Version}' pve-manager
          )"
          [ -n "$version" ]
          image_name="proxmox-ve-$PVE_PLATFORM-$PVE_ROOTFS-$version"
          printf 'image_name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_NAME=%s\n' "$image_name" >> "$GITHUB_ENV"
          sudo mv "dist/proxmox-ve-$PVE_PLATFORM-$PVE_ROOTFS.img" "dist/$image_name.img"

      - name: Validate completed image
        run: |
          sudo --preserve-env=PVE_PLATFORM,PVE_ROOTFS,PVE_HOSTNAME,PVE_DOMAIN,PVE_IPV4_CIDR,PVE_GATEWAY,PVE_DNS_SERVER \
            bash tools/validate-pve-image.sh --image "dist/$IMAGE_NAME.img"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pve.outputs.image_name }}
          path: dist/${{ steps.pve.outputs.image_name }}.img
          retention-days: 14
          compression-level: 6
